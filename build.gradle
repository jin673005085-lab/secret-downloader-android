plugins {
    id 'com.android.application' version '8.13.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.21' apply false
}

allprojects {
    // Windows test workers can lose non-ASCII paths; allow a separate ASCII-only output directory.
    def outputRoot = providers.gradleProperty('androidBuildRoot').orNull
    if (outputRoot != null) layout.buildDirectory = file("$outputRoot/${project.name}")
}
